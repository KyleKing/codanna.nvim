name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim-version: [stable, nightly]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .test-deps
          key: ${{ runner.os }}-nvim-deps-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-nvim-deps-
      
      - name: Install dependencies
        run: make deps
      
      - name: Run unit tests
        run: make test
      
      - name: Check formatting (Linux only)
        if: matrix.os == 'ubuntu-latest' && matrix.nvim-version == 'stable'
        run: |
          if command -v stylua &> /dev/null; then
            make lint
          else
            echo "stylua not installed, skipping lint check"
          fi

  integration-tests:
    name: Integration tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim-version: [stable]
    
    env:
      CODANNA_VERSION: "0.9.13"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}
      
      - name: Cache codanna binary
        id: cache-codanna
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/codanna
          key: ${{ runner.os }}-${{ runner.arch }}-codanna-${{ env.CODANNA_VERSION }}
      
      - name: Install codanna CLI from binary
        if: steps.cache-codanna.outputs.cache-hit != 'true'
        run: |
          VERSION="${CODANNA_VERSION}"
          
          # Detect platform and architecture
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          
          if [ "$OS" = "linux" ]; then
            PLATFORM="linux-x64"
          elif [ "$OS" = "darwin" ]; then
            if [ "$ARCH" = "arm64" ]; then
              PLATFORM="macos-arm64"
            else
              PLATFORM="macos-x64"
            fi
          else
            echo "Unsupported OS: $OS"
            exit 1
          fi
          
          # Download and extract binary
          TARBALL="codanna-${VERSION}-${PLATFORM}.tar.xz"
          URL="https://github.com/bartolli/codanna/releases/download/v${VERSION}/${TARBALL}"
          
          echo "Downloading codanna from $URL..."
          curl -L -o "/tmp/${TARBALL}" "$URL"
          
          # Extract binary
          mkdir -p ~/.local/bin
          tar -xf "/tmp/${TARBALL}" -C ~/.local/bin
          chmod +x ~/.local/bin/codanna
          
          echo "Installed codanna to ~/.local/bin/codanna"
      
      - name: Add codanna to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Verify codanna installation
        run: |
          codanna --version
          echo "Codanna installed successfully"
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .test-deps
          key: ${{ runner.os }}-nvim-deps-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-nvim-deps-
      
      - name: Cache test repositories
        uses: actions/cache@v4
        with:
          path: test-repos
          key: ${{ runner.os }}-test-repos-v1
          restore-keys: |
            ${{ runner.os }}-test-repos-
      
      - name: Setup test repositories
        run: make setup-test-repos
      
      - name: Install dependencies
        run: make deps
      
      - name: Run integration tests
        run: make test-integration
